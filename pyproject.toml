[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-orchestrate = "jev_ultrafast.orchestrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120
extend-exclude = [
    # One-off local experiment scripts kept at the repo root for reference; the
    # shipped loop, tests, examples, and scripts/ stay fully linted.
    "auth-loop.py", "auth-loop2.py", "auth-loop3.py", "auth_loop_lib.py",
    "cdp.py", "cdputil.py", "check_auth.py", "cover_shot.py", "eval.py",
    "inspect-settings.py", "mouse.py", "nav-plane.py", "nav.py",
    "nav_infisical.py", "poll_authed.py", "poll_login.py", "probe_endpoints.py",
    "seed-panel-token.py", "shot.py", "signup-dance.py", "stripe-fill.py",
    "verify_deck.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
